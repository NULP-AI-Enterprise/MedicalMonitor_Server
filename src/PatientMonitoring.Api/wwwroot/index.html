<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Central Nurse Station</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app-container">
        <aside id="sidebar">
            <div class="sidebar-brand">
                <div class="brand-title">CENTRAL STATION</div>
                <div class="brand-clock" id="clock">--:--:--</div>
            </div>

            <h2>Monitored Beds</h2>
            <div id="patient-toggles">
                <div class="roster-empty" id="roster-empty">Waiting for roster&hellip;</div>
            </div>

            <div class="sidebar-alerts">
                <div class="alert-tally">
                    <span class="tally critical"><span id="tally-critical">0</span> CRIT</span>
                    <span class="tally warning"><span id="tally-warning">0</span> WARN</span>
                </div>
                <button id="silence-all-btn" type="button" disabled>SILENCE ALL</button>
            </div>

            <div class="sidebar-status">
                <div class="status-label">Connection</div>
                <div id="connection-status" class="connecting">CONNECTING&hellip;</div>
            </div>
        </aside>

        <main>
            <header>
                <h1>CENTRAL NURSE STATION</h1>
                <div class="header-meta"><span id="bed-count">0</span> beds displayed</div>
            </header>
            <div id="monitor-grid" class="cols-3"></div>
        </main>
    </div>

    <div id="detailed-modal" class="hidden" role="dialog" aria-modal="true" aria-labelledby="detail-patient-name">
        <div class="modal-content">
            <div class="modal-header">
                <div class="modal-identity">
                    <h1 id="detail-patient-name">Patient &mdash;</h1>
                    <div class="modal-subtitle" id="detail-patient-meta">&mdash;</div>
                </div>
                <button id="close-modal-btn" type="button">CLOSE &times;</button>
            </div>

            <div class="modal-body">
                <div class="modal-waveforms">
                    <div class="waveform-container large" data-trace="ecg">
                        <span class="trace-label color-ecg">ECG II</span>
                        <canvas id="detail-ecg-canvas"></canvas>
                    </div>
                    <div class="waveform-container large" data-trace="pleth">
                        <span class="trace-label color-spo2">PLETH</span>
                        <canvas id="detail-pleth-canvas"></canvas>
                    </div>
                    <div class="waveform-container large" data-trace="resp">
                        <span class="trace-label color-resp">RESP</span>
                        <canvas id="detail-resp-canvas"></canvas>
                    </div>
                </div>

                <div class="modal-numerics">
                    <div class="numeric-block color-ecg" data-slot="hr">
                        <div class="numeric-label">HR <span class="numeric-unit">bpm</span></div>
                        <div class="numeric-value" id="detail-hr">--</div>
                    </div>
                    <div class="numeric-block color-spo2" data-slot="spo2">
                        <div class="numeric-label">SpO2 <span class="numeric-unit">%</span></div>
                        <div class="numeric-value" id="detail-spo2">--</div>
                        <div class="numeric-sub">PR <span id="detail-pr">--</span></div>
                    </div>
                    <div class="numeric-block color-nibp" data-slot="nibp">
                        <div class="numeric-label">NIBP <span class="numeric-unit">mmHg</span></div>
                        <div class="numeric-value"><span id="detail-sys">--</span>/<span id="detail-dia">--</span></div>
                        <div class="numeric-sub">MAP (<span id="detail-map">--</span>)</div>
                    </div>
                    <div class="numeric-block color-resp" data-slot="resp">
                        <div class="numeric-label">RESP <span class="numeric-unit">rpm</span></div>
                        <div class="numeric-value" id="detail-resp">--</div>
                    </div>
                    <div class="numeric-block color-temp" data-slot="temp">
                        <div class="numeric-label">TEMP <span class="numeric-unit">&deg;C</span></div>
                        <div class="numeric-value" id="detail-temp">--</div>
                    </div>
                </div>
            </div>

            <div class="modal-footer">
                <div class="alerts-title">Active Alerts</div>
                <div id="detail-alerts" class="alert-list">
                    <div class="alert-none">No active alerts</div>
                </div>
            </div>
        </div>
    </div>

    <!-- Served locally: a ward station must come up without internet access. -->
    <script src="lib/signalr.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
